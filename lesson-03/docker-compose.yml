services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    networks:
      lab-net:
        ipv4_address: 10.0.2.20
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    networks:
      lab-net:
        ipv4_address: 10.0.2.21
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./configs/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./configs/rules/custom.rules:/etc/suricata/rules/custom.rules:ro
      - suricata-log:/var/log/suricata
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # macvlan 接口名类似 eth0@if2，需要去掉 @ifN 后缀
        IFACE=$$(ip -o link show | awk -F': ' '!/lo/ {print $$2; exit}' | sed 's/@.*//')
        echo "Suricata listening on: $$IFACE"
        exec suricata -c /etc/suricata/suricata.yaml -l /var/log/suricata -i "$$IFACE"
    restart: unless-stopped

  attacker:
    image: instrumentisto/nmap:latest
    container_name: attacker
    networks:
      lab-net:
        ipv4_address: 10.0.2.22
    entrypoint: ["sleep", "infinity"]

networks:
  lab-net:
    driver: macvlan
    driver_opts:
      parent: enp0s8
    ipam:
      config:
        - subnet: 10.0.2.0/24
          gateway: 10.0.2.2

volumes:
  suricata-log:
