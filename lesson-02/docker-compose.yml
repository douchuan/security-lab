
networks:
  # dmz-net: WAF 所在网络，对外暴露
  dmz-net:
    driver: bridge
  # app-net: 后端应用网络，仅 WAF 可访问
  app-net:
    driver: bridge
    internal: true

services:
  # WAF: Nginx + ModSecurity 反向代理
  nginx-modsecurity:
    image: owasp/modsecurity-crs:nginx
    container_name: nginx-modsecurity
    networks:
      - dmz-net
      - app-net
    ports:
      - "80:8080"
    environment:
      - BACKEND=http://juice-shop:3000
      - MODSEC_RULE_ENGINE=On
    depends_on:
      - juice-shop
    restart: unless-stopped

  # 后端应用 (distroless 镜像，无 shell/curl/wget)
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    networks:
      - app-net
    expose:
      - "3000"
    restart: unless-stopped
    # 健康检查由 lesson-06 的 Wazuh Dashboard 外部监控承担
