# SPDX-License-Identifier: MIT

networks:
  dmz-net:
    driver: bridge
  app-net:
    driver: bridge
    internal: true
  hids-net:
    driver: bridge
  siem-net:
    driver: bridge
    internal: true
  dashboard-net:
    driver: bridge

services:
  # =====================
  # 应用层
  # =====================

  # WAF: Nginx + ModSecurity
  nginx-modsecurity:
    image: owasp/modsecurity-crs:nginx
    container_name: nginx-modsecurity
    networks:
      - dmz-net
      - app-net
    ports:
      - "80:8080"

    # - `RULE_ENGINE=On` + `AUDIT_ENGINE=On`：拦攻击 + 记录所有请求（你现在的配置，适合学习实验，因为能看到完整的攻击请求长什么样）
    # - `RULE_ENGINE=On` + `AUDIT_ENGINE=RelevantOnly`：拦攻击 + 只记录被拦的请求（生产环境常用）
    # - `RULE_ENGINE=DetectionOnly` + `AUDIT_ENGINE=On`：不拦但记录所有请求（上线前先观察误报）
    environment:
      - BACKEND=http://juice-shop:3000
      - MODSEC_RULE_ENGINE=On
      - MODSEC_AUDIT_LOG=/var/log/modsecurity/audit.log
      - MODSEC_AUDIT_ENGINE=On
      - MODSEC_AUDIT_LOG_TYPE=Serial
    depends_on:
      - juice-shop
    restart: unless-stopped
    volumes:
      - waf-log:/var/log/modsecurity
    # Note: 
    # 容器以 root 运行违背最小权限原则。如果 WAF 容器被攻破，攻击者拿到的就是容器内 root 权限，逃逸到宿主机的风险更大
    user: "root"

  # 后端应用 (distroless 镜像，无 shell/curl/wget)
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    networks:
      - app-net
      - hids-net
    expose:
      - "3000"
    volumes:
      - juice-shop-data:/app
      - juice-shop-log:/var/log/juiceshop
    restart: unless-stopped

  # =====================
  # 主机层
  # =====================

  # HIDS: Wazuh Agent
  wazuh-agent:
    image: wazuh/wazuh-agent:4.14.8
    container_name: wazuh-agent
    networks:
      - hids-net
      - siem-net
    volumes:
      # 日志收集：各组件日志通过 volume 挂载给 Agent
      - juice-shop-log:/monitored/juice-shop/logs:ro
      - waf-log:/monitored/modsecurity:ro
      # Agent 配置
      - ./configs/ossec.conf:/var/ossec/etc/ossec.conf:ro
    environment:
      - WAZUH_MANAGER=wazuh-manager
    depends_on:
      wazuh-manager:
        condition: service_healthy
    restart: unless-stopped

  # =====================
  # 聚合层 (SIEM)
  # =====================

  # SIEM: Wazuh Manager
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.8
    container_name: wazuh-manager
    networks:
      - siem-net
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - ./configs/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./configs/decoders/modsec-decoder.xml:/var/ossec/etc/decoders/modsec-decoder.xml:ro
      - ./configs/vd-disable.conf:/var/ossec/ossec.conf.overrides/vd-disable.conf:ro
      - wazuh-api-etc:/var/ossec/api/configuration
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-var:/var/ossec
      # 挂载其他组件日志供 SIEM 分析（Manager 直接读取 volume）
      - waf-log:/var/log/modsecurity:ro
      - juice-shop-log:/var/log/juiceshop:ro
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
      - FILEBEAT_SSL_VERIFICATION_MODE=none
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://127.0.0.1:55000 -o /dev/null; [ $? -eq 0 -o $? -eq 22 ]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # =====================
  # 展示层
  # =====================

  # 存储: Wazuh Indexer (OpenSearch)
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.8
    container_name: wazuh-indexer
    networks:
      - siem-net
      - dashboard-net
    ports:
      - "9200:9200"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_DISCOVERY_TYPE=single-node
      - bootstrap_system_call_filter=false
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./configs/indexer/entrypoint-wrapper.sh:/entrypoint-wrapper.sh
    entrypoint: ["/bin/bash", "/entrypoint-wrapper.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf https://localhost:9200 -k -u admin:admin || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Dashboard: Wazuh Dashboard
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.8
    container_name: wazuh-dashboard
    networks:
      - dashboard-net
      - siem-net
    ports:
      - "443:443"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
    volumes:
      - ./configs/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./configs/dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
    depends_on:
      wazuh-indexer:
        condition: service_healthy
      wazuh-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost:443 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  waf-log:
  juice-shop-data:
  juice-shop-log:
  wazuh-api-etc:
  wazuh-manager-etc:
  wazuh-manager-var:
  wazuh-indexer-data:
