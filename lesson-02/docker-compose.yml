version: "3.8"

networks:
  # dmz-net: WAF 所在网络，对外暴露
  dmz-net:
    driver: bridge
  # app-net: 后端应用网络，仅 WAF 可访问
  app-net:
    driver: bridge
    internal: true

services:
  # WAF: Nginx + ModSecurity 反向代理
  nginx-modsecurity:
    image: owasp/modsecurity-crs:nginx
    container_name: nginx-modsecurity
    networks:
      - dmz-net
      - app-net
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      juice-shop:
        condition: service_healthy
    restart: unless-stopped

  # 后端应用
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    networks:
      - app-net
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
