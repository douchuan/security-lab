services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./configs/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./configs/rules/custom.rules:/etc/suricata/rules/custom.rules:ro
      - suricata-log:/var/log/suricata
    # 自动检测所有 UP 状态的物理网卡（不含 lo/docker0/bridge），兼容任意 VirtualBox 网络配置
    entrypoint:
      [
        "sh", "-c",
        "IFACES=$(ip -o link show up | awk -F': ' '$2 !~ /^(lo|veth|docker|br-)/ {gsub(/@.*/,\"\",$2); print $2}' | paste -sd,); \
         echo \"Suricata monitoring interfaces: $$IFACES\"; \
         suricata -c /etc/suricata/suricata.yaml -l /var/log/suricata -i $$IFACES"
      ]
    restart: unless-stopped

volumes:
  suricata-log:
