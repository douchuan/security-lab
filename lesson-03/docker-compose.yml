networks:
  app-net:
    driver: bridge

services:
  # 后端应用
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    networks:
      - app-net
    ports:
      - "3000:3000"
    restart: unless-stopped

  # NIDS: Suricata — 使用 host 网络直接监听宿主机流量
  # 注意：network_mode: host 仅在 Linux 上有效
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./configs/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./configs/rules/custom.rules:/etc/suricata/rules/custom.rules:ro
      - suricata-log:/var/log/suricata
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # 自动检测可用的网络接口
        IFACE=$(ip -o link show | awk -F': ' '$2 != "lo" {print $2; exit}')
        echo "Using interface: $IFACE"
        exec suricata -c /etc/suricata/suricata.yaml -l /var/log/suricata -i "$IFACE"
    restart: unless-stopped

volumes:
  suricata-log:
