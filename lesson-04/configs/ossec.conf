# Wazuh Agent 配置
# 用于监控 Juice Shop 容器的文件系统、进程和日志

<ossec_config>
  <client>
    <server>
      <address>wazuh-agent</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- 系统日志监控 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- 文件完整性监控 (FIM) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>30</frequency>

    <!-- 监控关键目录 -->
    <directories check_all="yes" realtime="yes">/app</directories>
    <directories check_all="yes" realtime="yes">/tmp</directories>
    <directories check_all="yes" realtime="yes">/etc</directories>

    <!-- 忽略频繁变化的目录 -->
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>

    <!-- 监控文件属性变化 -->
    <check_sha256>yes</check_sha256>
    <check_md5sum>yes</check_md5sum>
    <check_size>yes</check_size>
    <check_owner>yes</check_owner>
    <check_group>yes</check_group>
    <check_perm>yes</check_perm>
    <check_mtime>yes</check_mtime>
    <check_inode>yes</check_inode>
  </syscheck>

  <!-- Rootkit 检测 -->
  <rootkit_files>/var/ossec/etc/shared/rootkit_files.txt</rootkit_files>
  <rootkit_trojans>/var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>

  <!-- 主动响应（仅记录，不自动阻断） -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <!-- 日志格式 -->
  <logall>yes</logall>
  <logall_json>yes</logall_json>
</ossec_config>
