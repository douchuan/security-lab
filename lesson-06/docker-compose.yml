
networks:
  dmz-net:
    driver: bridge
  app-net:
    driver: bridge
    internal: true
  monitor-net:
    driver: bridge
  hids-net:
    driver: bridge
  siem-net:
    driver: bridge
    internal: true
  dashboard-net:
    driver: bridge

services:
  # =====================
  # 应用层
  # =====================

  # WAF: Nginx + ModSecurity
  nginx-modsecurity:
    image: owasp/modsecurity-crs:nginx
    container_name: nginx-modsecurity
    networks:
      - dmz-net
      - app-net
    ports:
      - "80:8080"
    environment:
      - BACKEND=http://juice-shop:3000
      - MODSEC_RULE_ENGINE=On
    depends_on:
      - juice-shop
    restart: unless-stopped
    volumes:
      - waf-log:/var/log/modsecurity

  # 后端应用 (distroless 镜像，无 shell/curl/wget)
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    networks:
      - app-net
      - hids-net
    expose:
      - "3000"
    volumes:
      - juice-shop-data:/app
      - juice-shop-log:/var/log/juiceshop
    restart: unless-stopped

  # =====================
  # 网络层
  # =====================

  # NIDS: Suricata
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    networks:
      - monitor-net
      - app-net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../lesson-03/configs/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - suricata-log:/var/log/suricata
    command: >
      -c /etc/suricata/suricata.yaml
      -i eth1
    restart: unless-stopped

  # =====================
  # 主机层
  # =====================

  # HIDS: Wazuh Agent
  wazuh-agent:
    image: wazuh/wazuh-agent:4.9.0
    container_name: wazuh-agent
    networks:
      - hids-net
      - siem-net
    volumes:
      - ../lesson-04/configs/ossec.conf:/var/ossec/etc/ossec.conf:ro
    environment:
      - WAZUH_MANAGER=wazuh-manager
    depends_on:
      wazuh-manager:
        condition: service_healthy
    restart: unless-stopped

  # =====================
  # 聚合层 (SIEM)
  # =====================

  # SIEM: Wazuh Manager
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    container_name: wazuh-manager
    networks:
      - siem-net
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      - ../lesson-05/configs/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - wazuh-api-etc:/var/ossec/api/configuration
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-var:/var/ossec
      # 挂载其他组件日志供 SIEM 分析
      - waf-log:/var/log/modsecurity:ro
      - suricata-log:/var/log/suricata:ro
      - juice-shop-log:/var/log/juiceshop:ro
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=none
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:55000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # =====================
  # 展示层
  # =====================

  # 存储: Wazuh Indexer (OpenSearch)
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.9.0
    container_name: wazuh-indexer
    networks:
      - siem-net
      - dashboard-net
    ports:
      - "9200:9200"
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf https://localhost:9200 -k -u admin:SecretPassword || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Dashboard: Wazuh Dashboard
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    container_name: wazuh-dashboard
    networks:
      - dashboard-net
    ports:
      - "443:443"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
    depends_on:
      wazuh-indexer:
        condition: service_healthy
      wazuh-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk https://localhost:443 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  waf-log:
  suricata-log:
  juice-shop-data:
  juice-shop-log:
  wazuh-api-etc:
  wazuh-manager-etc:
  wazuh-manager-var:
