# Wazuh Agent 配置
# 用于监控 Juice Shop 容器的文件系统完整性
# 并收集各组件日志发送给 Wazuh Manager (SIEM)

<ossec_config>
  <client>
    <server>
      <address>wazuh-manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh-manager</manager_address>
      <port>1515</port>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- 文件完整性监控 (FIM) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>30</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- 监控 Juice Shop 应用目录 -->
    <directories>/monitored/juice-shop/data</directories>

    <!-- 忽略频繁变化的目录 -->
    <ignore>/monitored/juice-shop/data/node_modules</ignore>
    <ignore>/monitored/juice-shop/data/logs</ignore>
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
  </syscheck>

  <!-- ===================== 日志收集 (logcollector) ===================== -->
  <!-- 三个日志源，三种格式，展示 SIEM 如何统一处理异构日志 -->

  <!-- 1. Juice Shop Access Log (Morgan/Node.js 格式) -->
  <!--    例: 192.168.1.1 - - [10/Oct/2026:10:00:00 +0000] "POST /api/users/login HTTP/1.1" 401 123 -->
  <!--    Wazuh 没有内置 decoder，需要自定义 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/monitored/juice-shop/logs/access.log</location>
  </localfile>

  <!-- 2. Suricata NIDS 日志 (JSON eve.json 格式) -->
  <!--    Wazuh 内置 suricata decoder 自动解析 -->
  <localfile>
    <log_format>json</log_format>
    <location>/monitored/suricata/eve.json</location>
  </localfile>

  <!-- Rootkit 检测 (4.14+ 使用 rootcheck 模块) -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <!-- 主动响应（仅记录，不自动阻断） -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>
</ossec_config>
