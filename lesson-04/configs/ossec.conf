# Wazuh Agent 配置
# 用于监控 Juice Shop 容器的文件系统完整性

<ossec_config>
  <client>
    <server>
      <address>wazuh-agent</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- 文件完整性监控 (FIM) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>30</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- 监控关键目录 (4.14 Agent 不支持 realtime/checksum 等选项) -->
    <directories>/monitored/juice-shop</directories>
    <directories>/tmp</directories>
    <directories>/etc</directories>

    <!-- 忽略频繁变化的目录 -->
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
  </syscheck>

  <!-- Rootkit 检测 (4.14+ 使用 rootcheck 模块) -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <!-- 主动响应（仅记录，不自动阻断） -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>
</ossec_config>
