# Wazuh Agent 配置
# 用于监控 Juice Shop 和 ModSecurity 日志，并监控 Juice Shop 数据目录文件完整性

<ossec_config>
  <client>
    <server>
      <address>wazuh-manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh-manager</manager_address>
      <port>1515</port>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- 文件完整性监控 (FIM) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>30</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- 监控 Juice Shop 数据目录 -->
    <directories>/monitored/juice-shop</directories>

    <!-- 忽略频繁变化的目录 -->
    <ignore>/monitored/juice-shop/node_modules</ignore>
    <ignore>/monitored/juice-shop/logs</ignore>
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
  </syscheck>

  <!-- ===================== 日志收集 (logcollector) ===================== -->

  <!-- 1. Juice Shop Access Log (Morgan/Node.js combined 格式) -->
  <!-- Wazuh 内置 web-accesslog decoder 自动解析，提取 srcip/url/status 等字段 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/monitored/juice-shop/logs/access.log.*</location>
  </localfile>

  <!-- 2. ModSecurity WAF 审计日志 (JSON 格式) -->
  <!-- 自定义 modsec-json decoder 解析 -->
  <localfile>
    <log_format>json</log_format>
    <location>/monitored/modsecurity/audit.log</location>
  </localfile>

  <!-- Rootkit 检测 -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <!-- 主动响应（仅记录，不自动阻断） -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>
</ossec_config>
