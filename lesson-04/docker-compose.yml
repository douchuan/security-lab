
networks:
  app-net:
    driver: bridge
  hids-net:
    driver: bridge

services:
  # 后端应用 (distroless 镜像，无 shell/curl/wget)
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    networks:
      - app-net
      - hids-net
    expose:
      - "3000"
    volumes:
      - juice-shop-data:/app
    restart: unless-stopped

  # HIDS: Wazuh Agent (模拟 — 监控 Juice Shop 容器)
  wazuh-agent:
    image: wazuh/wazuh-agent:4.9.0
    container_name: wazuh-agent
    networks:
      - hids-net
    volumes:
      - ./configs/ossec.conf:/var/ossec/etc/ossec.conf:ro
    environment:
      - WAZUH_MANAGER=wazuh-agent
    restart: unless-stopped

volumes:
  juice-shop-data:
