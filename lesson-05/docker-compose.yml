
networks:
  dmz-net:
    driver: bridge
  app-net:
    driver: bridge
    internal: true
  monitor-net:
    driver: bridge
  hids-net:
    driver: bridge
  siem-net:
    driver: bridge

services:
  # WAF: Nginx + ModSecurity
  nginx-modsecurity:
    image: owasp/modsecurity-crs:nginx
    container_name: nginx-modsecurity
    networks:
      - dmz-net
      - app-net
    ports:
      - "80:8080"
    environment:
      - BACKEND=http://juice-shop:3000
      - MODSEC_RULE_ENGINE=On
    depends_on:
      - juice-shop
    restart: unless-stopped

  # 后端应用 (distroless 镜像，无 shell/curl/wget)
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    networks:
      - app-net
      - hids-net
    expose:
      - "3000"
    volumes:
      - juice-shop-data:/app/data
      - juice-shop-logs:/app/logs
    restart: unless-stopped

  # NIDS: Suricata
  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    networks:
      - monitor-net
      - app-net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../lesson-03/configs/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - suricata-log:/var/log/suricata
    command: >
      -c /etc/suricata/suricata.yaml
      -i eth1
    restart: unless-stopped

  # HIDS: Wazuh Agent
  wazuh-agent:
    image: wazuh/wazuh-agent:4.14.8
    container_name: wazuh-agent
    networks:
      - hids-net
      - siem-net
    volumes:
      # 日志收集：各组件日志通过 volume 挂载给 Agent
      - juice-shop-logs:/monitored/juice-shop/logs:ro        # Juice Shop access log
      - suricata-log:/monitored/suricata:ro                  # Suricata eve.json
      # Agent 配置
      - ../lesson-04/configs/ossec.conf:/var/ossec/etc/ossec.conf:ro
    environment:
      - WAZUH_MANAGER=wazuh-manager
    depends_on:
      wazuh-manager:
        condition: service_healthy
    restart: unless-stopped

  # SIEM: Wazuh Manager
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.8
    container_name: wazuh-manager
    networks:
      - siem-net
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      # 自定义规则 & decoder
      - ./configs/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./configs/decoders:/var/ossec/etc/decoders/juice-shop:ro
      # 持久化数据
      - wazuh-api-etc:/var/ossec/api/configuration
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-var:/var/ossec
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:55000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  suricata-log:
  juice-shop-data:
  juice-shop-logs:
  wazuh-api-etc:
  wazuh-manager-etc:
  wazuh-manager-var:
