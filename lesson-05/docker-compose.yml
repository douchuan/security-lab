
networks:
  dmz-net:
    driver: bridge
  app-net:
    driver: bridge
    internal: true
  hids-net:
    driver: bridge
  siem-net:
    driver: bridge

services:
  # WAF: Nginx + ModSecurity
  nginx-modsecurity:
    image: owasp/modsecurity-crs:nginx
    container_name: nginx-modsecurity
    networks:
      - dmz-net
      - app-net
    ports:
      - "80:8080"
    environment:
      - BACKEND=http://juice-shop:3000
      - MODSEC_RULE_ENGINE=On
      - MODSEC_AUDIT_LOG=/var/log/modsecurity/audit.log
      - MODSEC_AUDIT_ENGINE=On
      - MODSEC_AUDIT_LOG_TYPE=Serial
    volumes:
      - modsec-log:/var/log/modsecurity
    user: "root"
    depends_on:
      - juice-shop
    restart: unless-stopped

  # 后端应用 (distroless 镜像，无 shell/curl/wget)
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    networks:
      - app-net
      - hids-net
    expose:
      - "3000"
    volumes:
      - juice-shop-data:/app/data
      - juice-shop-logs:/juice-shop/logs
    restart: unless-stopped

  # HIDS: Wazuh Agent
  wazuh-agent:
    image: wazuh/wazuh-agent:4.14.8
    container_name: wazuh-agent
    networks:
      - hids-net
      - siem-net
    volumes:
      # 日志收集：各组件日志通过 volume 挂载给 Agent
      - juice-shop-logs:/monitored/juice-shop/logs:ro        # Juice Shop access log
      - modsec-log:/monitored/modsecurity:ro                 # ModSecurity audit log
      # Agent 配置
      - ./configs/ossec.conf:/var/ossec/etc/ossec.conf:ro
    environment:
      - WAZUH_MANAGER=wazuh-manager
    depends_on:
      wazuh-manager:
        condition: service_healthy
    restart: unless-stopped

  # SIEM: Wazuh Manager
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.8
    container_name: wazuh-manager
    networks:
      - siem-net
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    volumes:
      # 自定义规则 & decoder
      - ./configs/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./configs/decoders/juice-shop-decoder.xml:/var/ossec/etc/decoders/juiceshop-decoder.xml:ro
      - ./configs/decoders/modsec-decoder.xml:/var/ossec/etc/decoders/modsec-decoder.xml:ro
      # 持久化数据
      - wazuh-api-etc:/var/ossec/api/configuration
      - wazuh-manager-etc:/var/ossec/etc
      - wazuh-manager-var:/var/ossec
    healthcheck:
      # API 只监听 IPv4，401 说明 API 已启动
      test: ["CMD-SHELL", "curl -sfk https://127.0.0.1:55000 -o /dev/null; [ $? -eq 0 -o $? -eq 22 ]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  juice-shop-data:
  juice-shop-logs:
  modsec-log:
  wazuh-api-etc:
  wazuh-manager-etc:
  wazuh-manager-var:
