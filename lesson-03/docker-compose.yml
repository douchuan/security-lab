services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./configs/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./configs/rules/custom.rules:/etc/suricata/rules/custom.rules:ro
      - suricata-log:/var/log/suricata
    # 智能选网卡：优先 Host-Only 网段（192.168.x.x），其次其他私有网段，兼容 VirtualBox
    entrypoint:
      [
        "sh", "-c",
        "IFACE=$(ip -o -4 addr show up | awk '$2 !~ /^(lo|docker|br-|veth)/ && $4 ~ /^192\\.168\\./ {print $2; exit}'); \
         if [ -z \"$$IFACE\" ]; then \
           IFACE=$(ip -o -4 addr show up | awk '$2 !~ /^(lo|docker|br-|veth)/ && ($4 ~ /^10\\./ || $4 ~ /^172\\./) {print $2; exit}'); \
         fi; \
         if [ -z \"$$IFACE\" ]; then \
           IFACE=$(ip -o link show up | awk -F': ' '$2 !~ /^(lo|veth|docker|br-)/ {gsub(/@.*/,\"\",$2); print $2; exit}'); \
         fi; \
         echo \"Suricata monitoring interface: $$IFACE\"; \
         suricata -c /etc/suricata/suricata.yaml -l /var/log/suricata -i $$IFACE"
      ]
    restart: unless-stopped

volumes:
  suricata-log:
